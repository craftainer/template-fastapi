# Stack service: Postgres, reachable only from other containers on
# the compose-generated default network (see ../README.md).
# POSTGRES_* values come from postgres.env, next to this file (see
# ../README.md's "Configuration" section). The env_file path below is
# relative to this file's own directory, not .devcontainer/ -- see
# ../README.md's "Devcontainer stack pattern" section.
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file:
      - ./postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # $$ (not $): a literal $ passed through to the container's own shell,
    # reading POSTGRES_USER/POSTGRES_DB from postgres.env above, rather than
    # compose trying to interpolate it from the host environment.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
