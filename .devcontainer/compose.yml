include:
  - ./stack/postgres/compose.yml
  - ./stack/s3/compose.yml
  - ./stack/keycloak/compose.yml
  - ./stack/redis/compose.yml
  - ./stack/mqtt/compose.yml
  - ./stack/selenium/compose.yml

# App service: the FastAPI application itself, built from the top-level
# Dockerfile's `develop` stage. The workspace is bind-mounted so source
# edits are picked up without a rebuild. env_file below pulls in each
# stack service's own credentials (see stack/README.md's "Configuration"
# section); src/app/config.py assembles DATABASE_URL and the S3 access/
# secret key fields from the raw postgres/rustfs values at runtime, and
# OIDC_* arrive from keycloak.env already fully composed.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: develop
      # No PYTHON_VERSION/DEBIAN_VERSION here: the Dockerfile's own ARG
      # defaults are the single source for those — see the root
      # README.md's "Versions and config" section.
    volumes:
      - ..:/workspace:cached
      # No volume for the venv (see UV_PROJECT_ENVIRONMENT in the
      # Dockerfile): a mounted venv gets swept by Windows DLP/malware-
      # scanning tools just like a bind-mounted one, so it lives purely in
      # the container's writable layer and is rebuilt by
      # `postCreateCommand` when needed.
      - claude-config:/home/vscode/.claude
    command: sleep infinity
    env_file:
      - ./stack/postgres/postgres.env
      - ./stack/s3/s3.env
      - ./stack/keycloak/keycloak.env
    # Waits for every stack service's own healthcheck (see each fragment's
    # compose.yml) so `docker compose up` -- and therefore devcontainers/ci's
    # runCmd, and postCreateCommand -- never starts api, prek, or pytest
    # before the service they'd talk to is actually ready.
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      selenium:
        condition: service_healthy
    environment:
      # Fixed in-network hostnames/ports, not credentials, so they're
      # literal here rather than pulled from a stack env file. MODE is a
      # behavior toggle, not a credential either -- see src/app/config.py
      # and src/app/README.md's "MODE" section; the devcontainer always
      # runs dev (debugger enabled) unless overridden.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://s3:9000
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MODE: dev
    # No ports: mapping and no networks: block — see the root README's
    # "Don't". Host access to :8000 comes from devcontainer.json's
    # forwardPorts, and api reaches every stack service by name on
    # the default network compose generates for this project.

volumes:
  # Persists Claude Code CLI session/credential state across container
  # rebuilds. Unlike the venv above, this is a small amount of
  # session-state data, not thousands of dependency files, so the
  # DLP/malware-scanning concern that rules out mounting the venv doesn't
  # apply the same way here.
  claude-config:
